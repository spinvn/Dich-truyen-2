name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.6.4
      - run: npm install -g cordova@12
      - run: mkdir -p www && cp index.html www/index.html
      - run: cordova platform add android@12.0.1
      - run: |
          cordova plugin add cordova-plugin-background-mode@0.7.3
          cordova plugin add cordova-plugin-file@8.0.1
          cordova plugin add cordova-plugin-x-socialsharing@6.0.4
      - run: cordova build android --debug
      - uses: actions/upload-artifact@v4
        with:
          name: chinh-van-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
